<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainingsbuch – ASCENSUS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg: #16171a;
    --surface: #1f2119;
    --border: rgba(242,241,237,0.12);
    --border-strong: rgba(242,241,237,0.22);
    --text: #f2f1ed;
    --text-dim: #9a9ca5;
    --accent: #556B4E;
    --accent-text: #f2f1ed;
    --leicht: #6fcf97;
    --okay: #7fa7c9;
    --hart: #e4572e;
    --radius: 6px;
    --offwhite: #F5F3EE;
    --anthrazit: #232323;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 48px;
  }

  h1,h2{ font-family:'Space Grotesk', system-ui, sans-serif; margin:0; }

  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px; background: var(--offwhite); color: var(--anthrazit);
  }
  .navbar img{ height: 30px; }
  .navbar .nav-right{ display:flex; align-items:center; gap:16px; }
  .navbar a.back{ color: var(--anthrazit); text-decoration:none; font-size:0.85rem; opacity:0.7; font-family:'IBM Plex Sans', system-ui, sans-serif; }
  .navbar button.logout{
    background:none; border:none; color: var(--anthrazit); opacity:0.65;
    font-size:0.85rem; cursor:pointer; font-family:'IBM Plex Sans', system-ui, sans-serif;
  }

  section{ padding: 18px; border-bottom: 1px solid var(--border); }
  .screen{ display:none; }
  .screen.active{ display:block; }

  .screen-back{
    display:inline-block; margin: 16px 18px 0; color: var(--text-dim);
    text-decoration:none; font-size:0.85rem; cursor:pointer; background:none; border:none;
    font-family:'IBM Plex Sans', system-ui, sans-serif; padding:0;
  }

  /* ---------- Übersicht ---------- */
  #overview-screen .head{ padding: 18px 18px 4px; }
  #overview-screen h1{ font-size:1.35rem; font-weight:700; letter-spacing:-0.01em; }
  #overview-screen .sub{ color: var(--text-dim); font-size:0.85rem; margin-top:4px; }

  .new-training-btn{
    display:block; width: calc(100% - 36px); margin: 16px 18px;
    padding: 15px 0; text-align:center; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-text); border:none;
    font-family:'IBM Plex Sans', system-ui, sans-serif; font-weight:600; font-size:0.98rem; cursor:pointer;
  }
  .new-training-btn:active{ transform: scale(0.98); }

  #dayList{ padding: 0 18px 18px; }
  .day-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 4px; border-top: 1px solid var(--border);
    cursor:pointer; background:none; border-left:none; border-right:none; border-bottom:none;
    width:100%; text-align:left; color: var(--text); font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  #dayList .day-row:first-child{ border-top: none; }
  .day-row:active{ opacity:0.7; }
  .day-date{ font-size:1rem; font-weight:600; }
  .day-meta{ font-size:0.8rem; color: var(--text-dim); margin-top:3px; }
  .day-chevron{ color: var(--text-dim); font-size:1.2rem; }

  /* ---------- Tag-Detail ---------- */
  #day-screen .head{ padding: 16px 18px 4px; }
  #day-screen h2{ font-size:1.2rem; font-weight:700; }
  .add-to-day-btn{
    margin: 4px 18px 0; padding: 11px 16px; display:inline-block;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: transparent; color: var(--text); font-size:0.85rem; cursor:pointer;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  #dayEntries{ padding: 6px 18px 18px; }

  /* ---------- geteilte Entry-Zeilen ---------- */
  .entry{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 0; border-top: 1px solid var(--border);
  }
  .entry:first-of-type{ border-top: none; }
  .entry-main{ display:flex; flex-direction:column; }
  .entry-ex{ font-size:0.95rem; font-weight:500; }
  .entry-detail{ font-size:0.82rem; color: var(--text-dim); margin-top:2px; }
  .entry-right{ display:flex; align-items:center; gap:10px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.leicht{ background: var(--leicht); }
  .dot.okay{ background: var(--okay); }
  .dot.hart{ background: var(--hart); }
  .tendenz-label{
    display:flex; align-items:center; gap:6px;
    font-size:0.78rem; text-transform:capitalize; color: var(--text-dim);
  }
  .tendenz-label.leicht{ color: var(--leicht); }
  .tendenz-label.okay{ color: var(--okay); }
  .tendenz-label.hart{ color: var(--hart); }
  .del{
    background:none; border:none; color: var(--text-dim); font-size:1.1rem;
    cursor:pointer; padding:4px 6px; line-height:1;
  }
  .empty{ color: var(--text-dim); font-size:0.9rem; padding: 8px 0 18px; }
  .loading{ color: var(--text-dim); font-size:0.9rem; padding: 30px 18px; text-align:center; }

  /* ---------- Neues Training: Timer ---------- */
  #timer-section{
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
  }
  #timer-section h2{ font-size: 0.95rem; font-weight:600; color: var(--text-dim); margin-bottom: 12px; }
  .timer-display{
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 20vw, 4.5rem);
    text-align: center;
    letter-spacing: -0.02em;
    padding: 10px 0 4px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.2s, color 0.2s;
  }
  .timer-display.done{
    border-color: var(--accent);
    color: var(--accent);
    animation: pulse 0.9s ease-in-out 3;
  }
  @media (prefers-reduced-motion: reduce){
    .timer-display.done{ animation: none; }
  }
  @keyframes pulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.45; }
  }
  .presets{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .chip{
    flex:1; min-width: 64px; padding:10px 0; text-align:center;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:0.9rem; font-weight:500; cursor:pointer;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.active{ border-color: var(--accent); color: var(--accent); }

  .custom-row{ display:flex; gap:8px; margin-top:8px; }
  .custom-row input{
    flex:1; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); color: var(--text); padding:10px 12px; font-size:0.9rem;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  .custom-row button{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    color: var(--text-dim); padding:0 16px; font-size:0.9rem; cursor:pointer;
  }

  .timer-controls{ display:flex; gap:8px; margin-top:14px; }
  .btn{
    flex:1; padding:13px 0; border-radius: var(--radius); border:1px solid var(--border-strong);
    font-family:'IBM Plex Sans', system-ui, sans-serif; font-weight:600; font-size:0.95rem; cursor:pointer;
    background: transparent; color: var(--text);
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:disabled{ opacity:0.6; cursor:default; }

  /* ---------- Neues Training: Formular ---------- */
  #form-section h2{ font-size: 0.95rem; font-weight:600; color: var(--text-dim); margin-bottom: 12px; }
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size:0.8rem; color: var(--text-dim); margin-bottom:5px; }
  .field input{
    width:100%; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); color: var(--text); padding:11px 12px; font-size:0.95rem;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  .field input:focus-visible, .chip:focus-visible, .btn:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .row3{ display:flex; gap:8px; }
  .row3 .field{ flex:1; }
  .hint{ font-size:0.78rem; color: var(--text-dim); margin-top:-6px; margin-bottom:12px; min-height: 1em; }
  .bw-check{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    font-size:0.85rem; color: var(--text-dim); cursor:pointer;
  }
  .bw-check input{ width:auto; margin:0; accent-color: var(--accent); }
  .field input:disabled{ opacity:0.4; }
  .formmsg{ font-size:0.82rem; margin-top:8px; min-height:1.1em; }
  .formmsg.error{ color: var(--hart); }
  .save-confirm{ display:none; margin-top:14px; }
  .save-confirm-msg{ color: var(--leicht); font-size:0.88rem; font-weight:600; margin-bottom:10px; }
  .save-confirm-row{ display:flex; gap:8px; }
  .btn-finish{ background: var(--hart); border-color: var(--hart); color: #fff; border-radius: 999px; }
  .tendenz-dist{ padding: 4px 18px 18px; }
  .tendenz-bar{ display:flex; height:14px; border-radius:7px; overflow:hidden; background: var(--surface); }
  .tendenz-legend{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; font-size:0.8rem; color: var(--text-dim); }
  .tendenz-legend .dot{ margin-right:5px; }
  .dist-heading{
    padding: 14px 18px 0; font-size:0.78rem; color: var(--text-dim);
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .muscle-dist{ padding: 8px 18px 18px; }
  .mg-row{ display:flex; align-items:center; gap:10px; padding: 6px 0; }
  .mg-label{ width:80px; flex-shrink:0; font-size:0.82rem; }
  .mg-bar-track{ flex:1; height:10px; border-radius:5px; background: var(--surface); overflow:hidden; }
  .mg-bar-fill{ height:100%; background: var(--accent); border-radius:5px; }
  .mg-value{ width:72px; flex-shrink:0; text-align:right; font-size:0.78rem; color: var(--text-dim); }
  .body-map{ display:flex; gap:24px; justify-content:center; padding: 6px 18px 4px; flex-wrap:wrap; }
  .body-map-fig{ text-align:center; }
  .body-map-fig figcaption{ font-size:0.78rem; color: var(--text-dim); margin-top:4px; }
  .body-map-legend{
    display:flex; align-items:center; gap:8px; justify-content:center;
    font-size:0.72rem; color: var(--text-dim); padding: 2px 18px 14px;
  }
  .legend-gradient{
    width:100px; height:8px; border-radius:4px;
    background: linear-gradient(90deg, #2a2b27, #556B4E, #B59A5D);
  }

  .tendenz-picker{ display:flex; gap:8px; margin-bottom:16px; }
  .tendenz-btn{
    flex:1; padding:11px 0; text-align:center; border-radius: var(--radius);
    border:1px solid var(--border); background: var(--surface); color: var(--text-dim);
    font-family:'IBM Plex Sans', system-ui, sans-serif; font-weight:500; font-size:0.88rem; cursor:pointer;
  }
  .tendenz-btn[data-val="leicht"].active{ border-color: var(--leicht); color: var(--leicht); }
  .tendenz-btn[data-val="okay"].active{ border-color: var(--okay); color: var(--okay); }
  .tendenz-btn[data-val="hart"].active{ border-color: var(--hart); color: var(--hart); }

  /* ---------- Auswertung ---------- */
  .stats-link{
    display:block; width: calc(100% - 36px); margin: 10px 18px 16px;
    padding: 13px 0; text-align:center; color: var(--text);
    background: var(--surface); border:1px solid var(--border-strong); border-radius: var(--radius);
    font-size:0.95rem; font-weight:600; cursor:pointer;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  .stats-link:active{ transform: scale(0.98); }
  #stats-screen .head{ padding: 16px 18px 4px; }
  #stats-screen h2{ font-size:1.2rem; font-weight:700; }
  .range-row{ display:flex; gap:10px; padding: 12px 18px 0; align-items:flex-end; }
  .range-field{ flex:1; }
  .range-field label{ display:block; font-size:0.78rem; color: var(--text-dim); margin-bottom:5px; }
  .range-field input{
    width:100%; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); color: var(--text); padding:9px 10px; font-size:0.88rem;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  .stats-summary{ padding: 16px 18px 4px; font-size:0.88rem; color: var(--text-dim); line-height:1.6; }
  .stats-summary strong{ color: var(--text); }
  .chart-scroll{ overflow-x:auto; padding: 8px 18px 18px; }
  .chart-scroll svg{ display:block; }
  .exercise-history{ padding: 4px 18px 18px; border-top: 1px solid var(--border); margin-top: 4px; }
  .exercise-block{ border-top: 1px solid var(--border); }
  .exercise-block:first-child{ border-top: none; }
  .exercise-block summary{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 0; cursor:pointer; list-style:none;
  }
  .exercise-block summary::-webkit-details-marker{ display:none; }
  .exercise-block summary::marker{ content:''; }
  .exercise-name{ font-family:'Space Grotesk', system-ui, sans-serif; font-size:0.95rem; font-weight:600; }
  .exercise-total{ font-size:0.82rem; color: var(--text-dim); display:flex; align-items:center; gap:8px; }
  .exercise-chevron{ color: var(--text-dim); font-size:1rem; transition: transform 0.15s; }
  .exercise-block[open] .exercise-chevron{ transform: rotate(90deg); }
  .exercise-entries{ padding-bottom: 10px; }
  .exercise-entry{
    display:flex; align-items:center; justify-content:space-between;
    padding: 9px 0; border-top: 1px solid var(--border); gap:10px;
  }
  .exercise-entries .exercise-entry:first-of-type{ border-top: none; }
  .exercise-entry-date{ font-size:0.78rem; color: var(--text-dim); min-width: 62px; flex-shrink:0; }
  .exercise-entry-detail{ font-size:0.85rem; flex:1; }
  .trend-chart{ overflow-x:auto; padding: 4px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .trend-unit{ font-size:0.72rem; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
  .trend-pb{ font-size:0.82rem; color: var(--accent); font-weight:600; padding-top:8px; }
  .trend-chart svg{ display:block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
</head>
<body>

<div class="navbar">
  <a href="mitglieder-dashboard.html" aria-label="Zum Mitgliederbereich"><img src="logo-wordmark.png" alt="ASCENSUS"></a>
  <div class="nav-right">
    <a class="back" href="mitglieder-dashboard.html">← Mitgliederbereich</a>
    <button class="logout" id="logoutBtn">Ausloggen</button>
  </div>
</div>

<div id="loadingState" class="loading">Lade Trainingsbuch …</div>

<!-- ========== Übersicht ========== -->
<div class="screen" id="overview-screen">
  <div class="head">
    <h1>Trainingsbuch</h1>
    <p class="sub">Deine bisherigen Trainingseinheiten</p>
  </div>
  <button class="new-training-btn" id="newTrainingBtn">+ Neues Training starten</button>
  <button class="stats-link" id="statsLink">📊 Auswertung ansehen</button>
  <div id="dayList"></div>
</div>

<!-- ========== Tag-Detail ========== -->
<div class="screen" id="day-screen">
  <button class="screen-back" id="dayBackBtn">← Übersicht</button>
  <div class="head">
    <h2 id="dayHeading"></h2>
  </div>
  <button class="add-to-day-btn" id="addToDayBtn">+ Übung zu diesem Training hinzufügen</button>
  <div id="dayEntries"></div>
</div>

<!-- ========== Auswertung ========== -->
<div class="screen" id="stats-screen">
  <button class="screen-back" id="statsBackBtn">← Übersicht</button>
  <div class="head">
    <h2>Auswertung</h2>
  </div>
  <div class="range-row">
    <div class="range-field">
      <label for="rangeFrom">Von</label>
      <input type="date" id="rangeFrom">
    </div>
    <div class="range-field">
      <label for="rangeTo">Bis</label>
      <input type="date" id="rangeTo">
    </div>
  </div>
  <div class="stats-summary" id="statsSummary"></div>
  <div class="chart-scroll" id="chartScroll"></div>
  <div class="dist-heading">Tendenz</div>
  <div class="tendenz-dist" id="tendenzDist"></div>
  <div class="dist-heading">Muskelgruppen</div>
  <div class="body-map" id="bodyMap"></div>
  <div class="body-map-legend">
    <span>Wenig</span><div class="legend-gradient"></div><span>Viel</span>
  </div>
  <div class="muscle-dist" id="muscleDist"></div>
  <div class="exercise-history" id="exerciseHistory"></div>
</div>

<!-- ========== Neues Training ========== -->
<div class="screen" id="new-screen">
  <button class="screen-back" id="newBackBtn">← Übersicht</button>

  <section id="timer-section">
    <h2>Pausen-Timer</h2>
    <div class="timer-display" id="timerDisplay">01:30</div>
    <div class="presets">
      <div class="chip" data-secs="60">60 s</div>
      <div class="chip active" data-secs="90">90 s</div>
      <div class="chip" data-secs="120">120 s</div>
      <div class="chip" data-secs="180">180 s</div>
    </div>
    <div class="custom-row">
      <input type="number" id="customSecs" placeholder="eigene Zeit (Sek.)" inputmode="numeric">
      <button id="setCustom">Setzen</button>
    </div>
    <div class="timer-controls">
      <button class="btn btn-primary" id="startPause">Start</button>
      <button class="btn" id="resetTimer">Reset</button>
    </div>
  </section>

  <section id="form-section">
    <h2>Neuer Eintrag</h2>
    <div class="field">
      <label for="fDate">Datum</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fExercise">Übung</label>
      <input type="text" id="fExercise" list="exerciseList" placeholder="z. B. Armbeuger" autocomplete="off">
      <datalist id="exerciseList"></datalist>
    </div>
    <div class="hint" id="lastHint"></div>
    <label class="bw-check">
      <input type="checkbox" id="fBodyweight">
      Nur Körpergewicht (kein Zusatzgewicht)
    </label>
    <div class="row3">
      <div class="field">
        <label for="fWeight">Gewicht (kg)</label>
        <input type="number" id="fWeight" step="0.5" inputmode="decimal" placeholder="z. B. Zusatzgewicht">
      </div>
      <div class="field">
        <label for="fReps">Wdh.</label>
        <input type="number" id="fReps" inputmode="numeric">
      </div>
      <div class="field">
        <label for="fSets">Sätze</label>
        <input type="number" id="fSets" value="1" inputmode="numeric">
      </div>
    </div>
    <div class="tendenz-picker" id="tendenzPicker">
      <div class="tendenz-btn" data-val="leicht">Leicht</div>
      <div class="tendenz-btn active" data-val="okay">Okay</div>
      <div class="tendenz-btn" data-val="hart">Hart</div>
    </div>
    <button class="btn btn-primary" id="saveEntry" style="width:100%;">Eintrag speichern</button>
    <div class="formmsg" id="formMsg"></div>
    <div class="save-confirm" id="saveConfirm">
      <div class="save-confirm-msg">✓ Gespeichert.</div>
      <div class="save-confirm-row">
        <button class="btn btn-primary" id="addAnotherSetBtn"></button>
        <button class="btn btn-primary" id="addAnotherExerciseBtn">+ Weitere Übung</button>
      </div>
      <button class="btn btn-finish" id="finishDayBtn" style="width:100%; margin-top:8px;">Training fertig</button>
    </div>
  </section>
</div>

<script>

  // ---------------------------------------------------------------------
  // Körpergrafik-Vektordaten (männlich/weiblich, vorne/hinten) basierend auf
  // "react-muscle-highlighter" von soroojshehryar, MIT-lizenziert:
