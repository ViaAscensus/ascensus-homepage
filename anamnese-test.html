<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST – Anamnesebogen</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--olive:#556B4E;--sand:#B59A5D;--offwhite:#F5F3EE;--ink:#232323;--line:rgba(85,107,78,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--offwhite);font-family:'Inter',system-ui,sans-serif;font-size:17px;color:var(--ink);padding:2rem;-webkit-font-smoothing:antialiased}
h1{font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);margin-bottom:.5rem}
.badge{display:inline-block;background:var(--sand);color:#fff;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;padding:.2rem .6rem;border-radius:3px;margin-bottom:1.5rem}
.field{margin-bottom:1.2rem}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:.4rem}
input{width:100%;padding:.8rem .9rem;font-size:1rem;font-family:inherit;border:1px solid var(--line);border-radius:4px;background:#fff}
input:focus{outline:2px solid var(--olive);border-color:var(--olive)}
button{margin-top:1rem;padding:.95rem 2rem;background:var(--olive);color:#fff;border:0;border-radius:4px;font-family:inherit;font-size:.85rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
button:disabled{background:var(--line);color:#aaa}
.status{margin-top:1rem;font-size:.9rem;min-height:1.4rem}
.ok{color:var(--olive)}
.err{color:#A94438}
</style>
</head>
<body>

<div class="badge">⚠️ Nur zum Testen</div>
<h1>Test-Formular</h1>

<form id="form" novalidate>
  <div class="field">
    <label for="vorname">Vorname *</label>
    <input type="text" id="vorname" name="vorname" required placeholder="Max">
  </div>
  <div class="field">
    <label for="nachname">Nachname *</label>
    <input type="text" id="nachname" name="nachname" required placeholder="Mustermann">
  </div>
  <div class="field">
    <label for="email">E-Mail *</label>
    <input type="email" id="email" name="email" required placeholder="test@example.com">
  </div>

  <!-- Honeypot -->
  <input type="text" name="webseite" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off">

  <button type="submit" id="btn">Absenden</button>
  <div class="status" id="status"></div>
</form>

<script>
var ENDPOINT = 'https://n8n.ascensus.fit/webhook/anamnese';

document.getElementById('form').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('btn');
  var status = document.getElementById('status');

  if (!document.getElementById('vorname').value.trim() ||
      !document.getElementById('nachname').value.trim() ||
      !document.getElementById('email').value.trim()) {
    status.className = 'status err';
    status.textContent = 'Bitte alle Felder ausfüllen.';
    return;
  }

  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Wird gesendet …';

  fetch(ENDPOINT, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      vorname:       document.getElementById('vorname').value.trim(),
      nachname:      document.getElementById('nachname').value.trim(),
      email:         document.getElementById('email').value.trim(),
      formular:      'test',
      language:      'de',
      eingereicht_am: new Date().toISOString(),
      webseite:      ''
    })
  })
  .then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    status.className = 'status ok';
    status.textContent = '✅ Erfolgreich gesendet!';
    document.getElementById('form').reset();
    btn.disabled = false;
  })
  .catch(function(){
    status.className = 'status err';
    status.textContent = '❌ Fehler — Webhook erreichbar?';
    btn.disabled = false;
  });
});
</script>
</body>
</html>
