<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitglieder-Login – ASCENSUS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
<style>
  :root{
    --olive: #556B4E;
    --sand: #B59A5D;
    --offwhite: #F5F3EE;
    --anthrazit: #232323;
    --error: #A9432F;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--offwhite); color: var(--anthrazit);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; display:flex; flex-direction:column;
  }
  header{ padding: 24px 20px; }
  .navbar{ display:flex; align-items:center; justify-content:space-between; max-width: 960px; margin:0 auto; }
  .navbar img{ height: 34px; }
  .navbar a.back{ color: var(--anthrazit); text-decoration:none; font-size:0.9rem; opacity:0.7; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .card{
    width: 100%; max-width: 380px;
    background: #fff; border: 1px solid rgba(35,35,35,0.1);
    border-radius: 4px; padding: 36px 30px;
  }
  h1{
    font-size: 1.5rem; font-weight: 600; color: var(--olive);
    text-transform: uppercase; letter-spacing: 2px; margin: 0 0 24px;
  }
  label{ display:block; font-size:0.85rem; margin-bottom:6px; color: var(--anthrazit); }
  input{
    width:100%; padding: 11px 12px; margin-bottom:16px;
    border: 1px solid rgba(35,35,35,0.25); border-radius: 4px;
    font-family: inherit; font-size:0.95rem; background: var(--offwhite);
  }
  input:focus-visible{ outline: 2px solid var(--olive); outline-offset:1px; }
  button{
    width:100%; padding: 13px 0; border:none; border-radius: 4px;
    background: var(--olive); color:#fff; font-family: inherit;
    font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .msg{ font-size:0.85rem; margin-top:14px; min-height: 1.2em; }
  .msg.error{ color: var(--error); }
  .hint{ margin-top:22px; font-size:0.82rem; opacity:0.65; line-height:1.5; }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <a href="index.html" aria-label="Zur Startseite"><img src="logo-wordmark.png" alt="ASCENSUS"></a>
    <a class="back" href="index.html">← Startseite</a>
  </div>
</header>

<main>
  <div class="card">
    <h1>Mitglieder-Login</h1>
    <form id="loginForm">
      <label for="email">E-Mail</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Einloggen</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="hint">Noch keinen Zugang? Du bekommst eine persönliche Einladung von deinem Coach per E-Mail.</p>
  </div>
</main>

<script>
  const pb = new PocketBase('https://pb.ascensus.fit');

  if (pb.authStore.isValid) {
    window.location.href = 'mitglieder-dashboard.html';
  }

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.classList.remove('error');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Einen Moment …';

    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;

    try {
      await pb.collection('members').authWithPassword(email, pw);
      window.location.href = 'mitglieder-dashboard.html';
    } catch (err) {
      msg.textContent = 'E-Mail oder Passwort ist nicht korrekt.';
      msg.classList.add('error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Einloggen';
    }
  });
</script>

</body>
</html>
