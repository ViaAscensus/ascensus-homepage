<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Week 4 Check-in · ASCENSUS</title>
<style>
@font-face{font-family:"Inter";src:url("https://ascensus.fit/Inter-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --olive:#556B4E; --olive-dark:#3E5039; --sand:#B59A5D; --off:#F5F3EE; --paper:#FFFFFF; --ink:#232323;
  --ink-70:rgba(35,35,35,.72); --ink-45:rgba(35,35,35,.48); --line:rgba(85,107,78,.2);
  --good:rgba(85,107,78,.12); --soft:rgba(181,154,93,.16);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--off);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:24px 20px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--olive);font-size:.95rem}
.brand img{height:30px;width:auto;display:block}
.slogan{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);text-align:right}
.progress{margin-bottom:22px}
.part{display:flex;gap:14px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-45);margin-bottom:10px;flex-wrap:wrap}
.part span.on{color:var(--olive);font-weight:700}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--olive);transition:width .35s ease}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);margin-bottom:12px}
h1{font-size:clamp(1.5rem,6vw,2rem);font-weight:300;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);line-height:1.2;margin-bottom:16px}
h2{font-size:1.2rem;font-weight:600;line-height:1.35;margin-bottom:18px}
p{margin-bottom:14px;color:var(--ink-70)}
p.lead{font-size:1.05rem;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.opt{font:inherit;text-align:left;width:100%;background:var(--off);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--olive)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.opt .mark{flex:0 0 18px;height:18px;margin-top:2px;border:1.5px solid var(--olive);border-radius:50%;position:relative}
.opt:disabled{cursor:default}
.opt.correct{background:var(--good);border-color:var(--olive)}
.opt.correct .mark{background:var(--olive)}
.opt.correct .mark::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.picked{background:var(--soft);border-color:var(--sand)}
.opt.picked .mark{border-color:var(--sand);background:var(--sand)}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-left:3px solid var(--sand);background:var(--off);border-radius:0 8px 8px 0}
.fb strong{display:block;color:var(--olive);margin-bottom:4px;font-size:.95rem}
.fb p{margin:0;color:var(--ink-70);font-size:.95rem}
.fb p+p{margin-top:8px}
.src{font-size:.78rem;color:var(--ink-45)}
.actions{display:flex;justify-content:flex-end;margin-top:22px}
.btn{font:inherit;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:13px 24px;border:1px solid var(--olive);background:var(--olive);color:var(--off);border-radius:6px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--olive-dark)}
.btn.ghost{background:transparent;color:var(--olive)}
.btn.ghost:hover{background:var(--good)}
.road{position:relative;height:150px;margin:8px 8px 18px}
.road .line{position:absolute;left:0;right:0;top:64px;height:4px;background:var(--line);border-radius:4px}
.road .done{position:absolute;left:0;top:64px;height:4px;background:var(--olive);border-radius:4px}
.road .dot{position:absolute;top:57px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--paper);border:2px solid var(--sand)}
.road .dot.past{background:var(--olive);border-color:var(--olive)}
.road .dot.now{width:24px;height:24px;margin-left:-12px;top:54px;background:var(--sand);border-color:var(--sand);box-shadow:0 0 0 6px rgba(181,154,93,.25)}
.road .dot.goal{border-radius:4px;border-color:var(--olive);background:var(--good);width:22px;margin-left:-11px}
.road .lab{position:absolute;transform:translateX(-50%);font-size:.74rem;text-align:center;line-height:1.25;color:var(--ink-70);white-space:nowrap}
.road .lab b{display:block;font-size:.95rem;color:var(--ink)}
.road .up{top:6px}.road .down{top:92px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.sum div{background:var(--off);border:1px solid var(--line);border-radius:8px;padding:14px 8px;text-align:center}
.sum b{display:block;font-size:1.35rem;color:var(--olive);font-weight:600;font-variant-numeric:tabular-nums}
.sum span{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45)}
.quote{border-left:3px solid var(--sand);padding:6px 0 6px 16px;margin:6px 0 18px;font-size:1.1rem;font-style:italic;color:var(--ink)}
.ticks{list-style:none;margin:0 0 16px}
.ticks li{position:relative;padding-left:26px;margin-bottom:10px;color:var(--ink-70)}
.ticks li::before{content:"";position:absolute;left:3px;top:6px;width:6px;height:11px;border:solid var(--olive);border-width:0 2px 2px 0;transform:rotate(45deg)}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:.95rem}
.plan input{flex:1 1 160px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--off);color:var(--ink)}
.note{font-size:.74rem;color:var(--ink-45);margin-top:22px;text-align:center}
.sign{margin-top:8px;color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.card{padding:22px 18px}.sum b{font-size:1.15rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Ascensus</div>
    <div class="slogan">Echt. Fundiert. Nachhaltig.</div>
  </header>
  <div class="progress" id="progress" hidden>
    <div class="part" id="parts"></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <main id="stage" aria-live="polite"></main>
  <p class="note">General information, not medical advice. Your coach adapts everything to you.</p>
</div>

<script>
/* =====================================================================
   NUMBERS — change only this block (e.g. after the Monday check-in).
   Everything else in the quiz is calculated from these values.
   ===================================================================== */
const D = {
  start: 106,        // kg on day one
  now: 101,          // kg today  <-- update on Monday
  targetLow: 88,     // kg, lower end of the target range
  targetHigh: 90,    // kg, upper end of the target range
  protein1: 87,      // g protein per day, average week 1
  protein3: 105,     // g protein per day, average week 3
  sugar1: 58,        // g sugar per day, average week 1
  sugar3: 31,        // g sugar per day, average week 3
  steps1: 5100,      // steps per day, average week 1
  steps3: 7800,      // steps per day, average week 3
  week: 4,           // current coaching week
  milestones: [98, 95, 92]   // stops on the road (kg)
};
/* ===================================================================== */

const N = n => n.toLocaleString("en-GB");
const r5 = x => Math.round(x / 5) * 5;
const r10 = x => Math.round(x / 10) * 10;
const lost = D.start - D.now;
const mid = (D.targetLow + D.targetHigh) / 2;
const way = r5(lost / (D.start - mid) * 100);
const proteinUp = r5((D.protein3 / D.protein1 - 1) * 100);
const remLow = Math.max(0, D.now - D.targetHigh);
const remHigh = Math.max(0, D.now - D.targetLow);
const monthsLow = Math.max(1, Math.round(remLow / 1 / 4.33));
const monthsHigh = Math.max(monthsLow + 1, Math.round(remHigh / 0.5 / 4.33));
const next = D.milestones.find(m => m < D.now);
const nextGap = next ? D.now - next : 0;
const nextWeeks = next ? `${Math.max(1, Math.ceil(nextGap / 1))}–${Math.max(2, Math.ceil(nextGap / 0.5))}` : "";
const habitPct = r5(D.week * 7 / 66 * 100);
const stepsUp = r10((D.steps3 / D.steps1 - 1) * 100);
const sugarTxt = D.sugar3 / D.sugar1 <= 0.55 ? "sugar nearly halved" : `sugar down from ${D.sugar1} g to ${D.sugar3} g`;

const PARTS = ["Recap", "Know-how", "Ahead"];

const steps = [
  /* ---------- Recap ---------- */
  { part: 0, type: "single",
    q: `Day one: ${D.start} kg. How much have you lost since then?`,
    opts: [`About ${lost - 3} kg`, `About ${lost} kg`, `About ${lost + 3} kg`], correct: 1,
    fb: [`${lost} kg in your first weeks.`,
         `That is about ${way}% of the way to your target range of ${D.targetLow}–${D.targetHigh} kg. A part of this is water, which is normal at the start. More on that in a moment.`] },

  { part: 0, type: "single",
    q: `Your average daily protein, week 1 compared with week 3. Where did it end up?`,
    opts: [`${D.protein1} g → ${D.protein3 - 12} g`, `${D.protein1} g → ${D.protein3 - 6} g`, `${D.protein1} g → ${D.protein3} g`], correct: 2,
    fb: [`${D.protein1} g → ${D.protein3} g, about ${proteinUp}% more, day after day.`,
         `Protein is one of the main reasons meals keep you full for longer. And the other two numbers moved too: sugar from ${D.sugar1} g to ${D.sugar3} g a day, and steps from ${N(D.steps1)} to ${N(D.steps3)} a day.`] },

  { part: 0, type: "reflect",
    q: `Which of your changes feels like the biggest win to you?`,
    opts: ["The number on the scale", "Cooking meals I really enjoy", "Moving more", "Eating less sugar"],
    fb: [`Whichever you picked, that is the one to protect.`,
         `Wins you can feel in daily life are what keep a routine going, long after the first motivation has faded.`] },

  /* ---------- Know-how ---------- */
  { part: 1, type: "single",
    q: `After a fast start, the scale often slows down. What is usually going on?`,
    opts: ["Early losses include extra water; fat loss is steadier and slower", "The plan has stopped working", "The body is stuck and needs a shock"], correct: 0,
    fb: [`Slower weeks are not a stall.`,
         `Early drops often include water that is bound to stored carbohydrates (roughly 3 g of water per gram). What counts is the weekly trend, not one morning's number.`] },

  { part: 1, type: "single",
    q: `It is 9 pm and you want a snack. Which one fits your goals best?`,
    opts: ["Banana and pear (about 215 kcal, 2 g protein)", "A handful of hazelnuts (about 220 kcal, 5 g protein)", "Berries with quark (about 135 kcal, 18 g protein)"], correct: 2,
    fb: [`Berries with quark.`,
         `Fewer calories and about 16 g more protein than banana and pear, so it keeps you fuller. Nuts are healthy too, they are just very energy-dense.`] },

  { part: 1, type: "single",
    q: `A large sweetened chai latte (750 ml) contains about…`,
    opts: ["300 kcal", "150 kcal", "500 kcal"], correct: 0,
    fb: [`About 300 kcal, mostly from the syrup.`,
         `The same drink unsweetened is around 110 kcal. Same ritual, roughly 190 kcal less, and you keep the drink.`] },

  /* ---------- Ahead ---------- */
  { part: 2, type: "single",
    q: `At a steady, realistic pace of roughly 0.5–1 kg a week, how long might the remaining ${remLow}–${remHigh} kg take?`,
    opts: ["About 4 weeks", "More than a year", `About ${monthsLow}–${monthsHigh} months`], correct: 2,
    fb: [`About ${monthsLow}–${monthsHigh} months. A range, not a promise.`,
         `Some weeks will give you more, some less, and the pace usually slows the closer you get. The direction over several weeks is what matters.`] },

  { part: 2, type: "road" },

  { part: 2, type: "single",
    q: `How long does it take until a new routine runs on autopilot?`,
    opts: ["About 3 weeks", "About 2 months on average, but very individual", "About a year"], correct: 1,
    fb: [`About 2 months on average.`,
         `In a well-known study it took 66 days, ranging from under 3 weeks to 8 months depending on the person. You are in week ${D.week}, roughly ${habitPct}% of the way by the average. A single missed day did not derail anyone.`],
    src: "Lally et al., 2010" },

  { part: 2, type: "single",
    q: `Which plan is most likely to survive a tired Thursday?`,
    opts: ["“I will just stay motivated.”", "“I will try to eat more protein.”", "“When I make my morning coffee, I will set out quark and fruit.”"], correct: 2,
    fb: [`The one tied to a moment in your day.`,
         `Researchers call them if-then plans. Linking a new habit to something you already do every day clearly improves follow-through.`],
    src: "Gollwitzer & Sheeran, 2006" },

  { part: 2, type: "commit" },

  { part: 2, type: "final" }
];

const stage = document.getElementById("stage");
const progress = document.getElementById("progress");
const partsEl = document.getElementById("parts");
const barfill = document.getElementById("barfill");
let i = -1;       // -1 = intro
let picked = null; // for the commit card
let planText = "";  // the plan the person typed on the commit card
const total = steps.length - 1; // final screen is not counted

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function setProgress(){
  if(i < 0){progress.hidden = true; return}
  progress.hidden = false;
  const cur = steps[i].part;
  partsEl.innerHTML = PARTS.map((p,k)=>`<span class="${k===cur?"on":""}">${p}</span>`).join("");
  barfill.style.width = Math.min(100, (i / total) * 100) + "%";
}

function intro(){
  stage.innerHTML = `
  <section class="card">
    <p class="eyebrow">Week ${D.week} check-in</p>
    <h1>Your road so far, and what lies ahead</h1>
    <p class="lead">You are in week ${D.week}. Before we talk, here is a short quiz, about five minutes: a look back, a little know-how and, above all, a look ahead.</p>
    <p>Some questions have a right answer, some are just about you. Nothing is graded. It is a way to see how far you have already come.</p>
    <div class="actions"><button class="btn" id="go">Let us start</button></div>
  </section>`;
  document.getElementById("go").onclick = () => {i = 0; show()};
}

function optButtons(s){
  return s.opts.map((o,k)=>`<button class="opt" data-k="${k}" type="button"><span class="mark" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join("");
}

function single(s){
  stage.innerHTML = `
  <section class="card">
    <p class="eyebrow">${PARTS[s.part]}</p>
    <h2>${esc(s.q)}</h2>
    <div class="opts" id="opts">${optButtons(s)}</div>
    <div id="fb"></div>
    <div class="actions" id="act" hidden><button class="btn" id="nx">Continue</button></div>
  </section>`;
  const btns = [...stage.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    btns.forEach((x,j)=>{x.disabled = true;
      if(s.type==="single"){ if(j===s.correct) x.classList.add("correct"); else if(j===k) x.classList.add("picked"); else x.classList.add("dim"); }
      else { if(j===k) x.classList.add("picked"); else x.classList.add("dim"); }
    });
    let head = s.fb[0];
    if(s.type==="single" && k!==s.correct) head = "Here is the real answer: " + s.fb[0].charAt(0).toLowerCase() + s.fb[0].slice(1);
    document.getElementById("fb").innerHTML = `<div class="fb"><strong>${esc(head)}</strong><p>${esc(s.fb[1])}</p>${s.src?`<p class="src">${esc(s.src)}</p>`:""}</div>`;
    document.getElementById("act").hidden = false;
    document.getElementById("nx").focus();
  });
  document.getElementById("nx").onclick = () => {i++; show()};
}

function roadCard(){
  const span = D.start - D.targetLow;            // 0 .. 100 %
  const x = w => Math.max(0, Math.min(100, (D.start - w) / span * 100));
  const pts = [];
  pts.push({w:D.start, cls:"past", lab:"Start", up:true});
  pts.push({w:D.now, cls:"now", lab:"You are here", up:true});
  D.milestones.forEach(m => { if(m < D.now) pts.push({w:m, cls:"", lab:"", up:false}); });
  const nowX = x(D.now);
  let html = `<div class="road" role="img" aria-label="Road from ${D.start} kg to the target range ${D.targetLow} to ${D.targetHigh} kg, currently at ${D.now} kg">
    <div class="line"></div><div class="done" style="width:${nowX}%"></div>`;
  pts.forEach(p => {
    html += `<span class="dot ${p.cls}" style="left:${x(p.w)}%"></span>`;
    html += `<span class="lab ${p.up?"up":"down"}" style="left:${x(p.w)}%"><b>${p.w} kg</b>${p.lab}</span>`;
  });
  const gx = x((D.targetLow + D.targetHigh) / 2);
  html += `<span class="dot goal" style="left:${gx}%"></span><span class="lab up" style="left:${gx}%"><b>${D.targetLow}–${D.targetHigh} kg</b>Target</span></div>`;
  const nextTxt = next
    ? `Your next stop is <strong>${next} kg</strong>, about ${nextGap} kg away, roughly ${nextWeeks} weeks at a steady pace.`
    : `You are already in the home stretch to your target range.`;
  stage.innerHTML = `
  <section class="card">
    <p class="eyebrow">${PARTS[2]}</p>
    <h2>Your road ahead</h2>
    ${html}
    <p class="lead">${nextTxt}</p>
    <p>Small stops make a long road feel short. Each one is only a few kilos, and you have already left the start line behind you.</p>
    <div class="actions"><button class="btn" id="nx">Continue</button></div>
  </section>`;
  document.getElementById("nx").onclick = () => {i++; show()};
}

const COMMITS = [
  "swap one sugary drink for an unsweetened one",
  "add one protein-rich evening snack, for example quark with berries",
  "take one extra 15-minute walk on a desk day",
  "drink one extra glass of water with lunch"
];
function commitCard(){
  stage.innerHTML = `
  <section class="card">
    <p class="eyebrow">${PARTS[2]}</p>
    <h2>Pick one thing for next week. Just one.</h2>
    <div class="opts" id="opts">${COMMITS.map((c,k)=>`<button class="opt" data-k="${k}" type="button"><span class="mark" aria-hidden="true"></span><span>${esc(c.charAt(0).toUpperCase()+c.slice(1))}</span></button>`).join("")}</div>
    <div id="plan"></div>
    <div class="actions" id="act" hidden><button class="btn" id="nx">Continue</button></div>
  </section>`;
  const btns = [...stage.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    picked = +b.dataset.k;
    btns.forEach((x,j)=>{x.classList.toggle("picked", j===picked); x.classList.toggle("dim", j!==picked)});
    document.getElementById("plan").innerHTML = `
      <div class="fb"><strong>Make it a plan</strong>
      <div class="plan"><span>When</span><input id="when" type="text" placeholder="I make my morning coffee" aria-label="When will you do it"><span>I will ${esc(COMMITS[picked])}.</span></div></div>`;
    document.getElementById("act").hidden = false;
  });
  document.getElementById("nx").onclick = () => {
    const w = (document.getElementById("when") || {value:""}).value.trim().replace(/[.]+$/,"");
    const what = picked === null ? "" : COMMITS[picked];
    planText = what ? (w ? `When ${w}, I will ${what}.` : `I will ${what}.`) : "";
    i++; show();
  };
}

function finalCard(){
  stage.innerHTML = `
  <section class="card">
    <p class="eyebrow">Week ${D.week}</p>
    <h1>Where you stand</h1>
    <div class="sum">
      <div><b>${D.start} kg</b><span>Day one</span></div>
      <div><b>${D.now} kg</b><span>Today</span></div>
      <div><b>${D.targetLow}–${D.targetHigh}</b><span>Target</span></div>
    </div>
    <p>A while ago you described your picture of a year from now:</p>
    <div class="quote">“Routine, good eating, leaner me, more energy.”</div>
    <ul class="ticks">
      <li><strong>Routine:</strong> ${D.week - 1} weeks of tracking are behind you.</li>
      <li><strong>Good eating:</strong> ${D.protein3} g protein a day and ${sugarTxt}.</li>
      <li><strong>Leaner:</strong> ${lost} kg down, about ${way}% of the way.</li>
      <li><strong>More energy:</strong> a first sign is there, you already take about ${stepsUp}% more steps every day.</li>
    </ul>
    ${planText ? `<div class="fb"><strong>Your one thing for next week</strong><p>${esc(planText)}</p></div>` : ""}
    <p class="lead" style="margin-top:18px">Consistency beats every crash diet. You are doing exactly that.</p>
    <p class="sign">See you at our next call. Patrick</p>
    <div class="actions"><button class="btn ghost" id="again">Start again</button></div>
  </section>`;
  document.getElementById("again").onclick = () => {i = -1; picked = null; planText = ""; show()};
}

function show(){
  setProgress();
  window.scrollTo({top:0, behavior:"auto"});
  if(i < 0) return intro();
  const s = steps[i];
  if(s.type === "road") return roadCard();
  if(s.type === "commit") return commitCard();
  if(s.type === "final") return finalCard();
  return single(s);
}
show();
</script>
</body>
</html>
