<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zugang einrichten – ASCENSUS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
<style>
  :root{
    --olive: #556B4E;
    --sand: #B59A5D;
    --offwhite: #F5F3EE;
    --anthrazit: #232323;
    --error: #A9432F;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--offwhite); color: var(--anthrazit);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; display:flex; flex-direction:column;
  }
  header{ padding: 24px 20px; }
  .navbar{ display:flex; align-items:center; justify-content:space-between; max-width: 960px; margin:0 auto; }
  .navbar img{ height: 34px; }
  .navbar a.back{ color: var(--anthrazit); text-decoration:none; font-size:0.9rem; opacity:0.7; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .card{
    width: 100%; max-width: 400px;
    background: #fff; border: 1px solid rgba(35,35,35,0.1);
    border-radius: 4px; padding: 36px 30px;
  }
  h1{
    font-size: 1.4rem; font-weight: 600; color: var(--olive);
    text-transform: uppercase; letter-spacing: 2px; margin: 0 0 16px;
  }
  p.lead{ font-size:0.9rem; line-height:1.5; margin: 0 0 22px; }
  label{ display:block; font-size:0.85rem; margin-bottom:6px; }
  input{
    width:100%; padding: 11px 12px; margin-bottom:16px;
    border: 1px solid rgba(35,35,35,0.25); border-radius: 4px;
    font-family: inherit; font-size:0.95rem; background: var(--offwhite);
  }
  input:focus-visible{ outline: 2px solid var(--olive); outline-offset:1px; }
  button{
    width:100%; padding: 13px 0; border:none; border-radius: 4px;
    background: var(--olive); color:#fff; font-family: inherit;
    font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .msg{ font-size:0.85rem; margin-top:14px; min-height: 1.2em; }
  .msg.error{ color: var(--error); }
  .state{ text-align:center; font-size:0.9rem; line-height:1.6; }
  .state.error{ color: var(--error); }
  #setupForm{ display:none; }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <a href="index.html" aria-label="Zur Startseite"><img src="logo-wordmark.png" alt="ASCENSUS"></a>
    <a class="back" href="index.html">← Startseite</a>
  </div>
</header>

<main>
  <div class="card">
    <h1>Zugang einrichten</h1>
    <div id="checking" class="state">Einladung wird geprüft …</div>
    <div id="invalid" class="state error" style="display:none;">
      Dieser Link ist ungültig oder abgelaufen. Bitte wende Dich an Deinen Coach für eine neue Einladung.
    </div>

    <form id="setupForm">
      <p class="lead">Willkommen, <strong id="emailDisplay"></strong>. Lege hier Dein Passwort fest.</p>
      <label for="pw">Passwort</label>
      <input type="password" id="pw" required minlength="8" autocomplete="new-password">
      <label for="pw2">Passwort wiederholen</label>
      <input type="password" id="pw2" required minlength="8" autocomplete="new-password">
      <button type="submit" id="submitBtn">Zugang aktivieren</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</main>

<script>
  const pb = new PocketBase('https://pb.ascensus.fit');
  const token = new URLSearchParams(window.location.search).get('token');

  const checkingEl = document.getElementById('checking');
  const invalidEl = document.getElementById('invalid');
  const formEl = document.getElementById('setupForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  let invitation = null;

  async function checkToken() {
    if (!token) {
      showInvalid();
      return;
    }
    try {
      const result = await pb.collection('invitations').getFirstListItem(
        `token="${token}" && used=false`,
        { query: { token } }
      );
      if (new Date(result.expires_at) < new Date()) {
        showInvalid();
        return;
      }
      invitation = result;
      document.getElementById('emailDisplay').textContent = invitation.email;
      checkingEl.style.display = 'none';
      formEl.style.display = 'block';
    } catch (err) {
      showInvalid();
    }
  }

  function showInvalid() {
    checkingEl.style.display = 'none';
    invalidEl.style.display = 'block';
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.classList.remove('error');

    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw !== pw2) {
      msg.textContent = 'Die Passwörter stimmen nicht überein.';
      msg.classList.add('error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Einen Moment …';

    try {
      await pb.collection('members').create({
        email: invitation.email,
        password: pw,
        passwordConfirm: pw2,
        Geschlecht: invitation.Geschlecht
      });

      await pb.collection('invitations').update(
        invitation.id,
        { used: true },
        { query: { token } }
      );

      await pb.collection('members').authWithPassword(invitation.email, pw);
      window.location.href = 'mitglieder-dashboard.html';
    } catch (err) {
      msg.textContent = 'Zugang konnte nicht eingerichtet werden. Bitte versuch es erneut oder wende Dich an Deinen Coach.';
      msg.classList.add('error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Zugang aktivieren';
    }
  });

  checkToken();
</script>

</body>
</html>
